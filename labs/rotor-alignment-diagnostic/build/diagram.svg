<rect x="15" y="70" width="230" height="1350" rx="14" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 4"/><text x="130.0" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6cb0">THE BUYER&#x27;S COMPANY</text><rect x="260" y="70" width="380" height="1350" rx="14" fill="none" stroke="#2f855a" stroke-width="1.5" stroke-dasharray="4 4"/><text x="450.0" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f855a">THE APP · Google Cloud, Montréal (Canada)</text><rect x="655" y="70" width="250" height="1350" rx="14" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="780.0" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b6b6b">OUTSIDE SERVICES · BRANDON</text><text x="460.0" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Rotor Alignment Diagnostic: how it works</text><text x="460.0" y="58" font-size="13" font-weight="normal" text-anchor="middle" fill="#555">Numbers follow one company from purchase to next step</text><rect x="30" y="115" width="200" height="60" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="137" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">CEO buys</text><text x="42" y="155" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">in the Labs store</text><circle cx="30" cy="115" r="13" fill="#2b6cb0"/><text x="30" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text><rect x="670" y="115" width="220" height="60" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/><text x="682" y="137" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Squarespace</text><text x="682" y="155" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Labs store · $790</text><line x1="230" y1="145" x2="668" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="449.0" y="139.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">pays $790</text><rect x="670" y="205" width="220" height="78" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/><text x="682" y="227" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Key store</text><text x="682" y="245" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">(Google Secret Manager)</text><text x="682" y="263" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Claude + Squarespace keys</text><rect x="280" y="215" width="340" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="237" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Order checker</text><text x="292" y="255" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">asks Squarespace every 10 min</text><circle cx="280" cy="215" r="13" fill="#2f855a"/><text x="280" y="220" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">2</text><line x1="668" y1="165" x2="620" y2="230" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="640" y="200" font-size="12" font-weight="normal" text-anchor="end" fill="#333">new order</text><rect x="280" y="305" width="340" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="327" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Company record</text><text x="292" y="345" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">private drop-box link + CEO status link</text><line x1="450" y1="275" x2="450" y2="303" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="305" width="200" height="78" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="327" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">CEO sets up</text><text x="42" y="345" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">pastes interviewer into</text><text x="42" y="363" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">company AI · invites leaders</text><circle cx="30" cy="305" r="13" fill="#2b6cb0"/><text x="30" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text><line x1="278" y1="335" x2="232" y2="335" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="255" y="322" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">kit</text><rect x="30" y="415" width="200" height="96" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="437" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Company&#x27;s own AI</text><text x="42" y="455" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Claude · ChatGPT ·</text><text x="42" y="473" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Copilot · Gemini</text><text x="42" y="491" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">full chat stays here</text><line x1="130" y1="383" x2="130" y2="413" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="545" width="200" height="78" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="567" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Leaders (3–8)</text><text x="42" y="585" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">~20-min interview each,</text><text x="42" y="603" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">check own summary</text><circle cx="30" cy="545" r="13" fill="#2b6cb0"/><text x="30" y="550" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text><line x1="130" y1="511" x2="130" y2="543" stroke="#333" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="280" y="520" width="340" height="132" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="542" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Drop-box page</text><text x="292" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">• checks the format</text><text x="292" y="578" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">• removes name and role</text><text x="292" y="596" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">• counts (up to 8)</text><text x="292" y="614" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">• stores the summary</text><circle cx="280" cy="520" r="13" fill="#2f855a"/><text x="280" y="525" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">5</text><line x1="232" y1="590" x2="278" y2="590" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="255" y="580" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">paste</text><rect x="280" y="680" width="340" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="702" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Stored, names removed</text><text x="292" y="720" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Firestore, Montréal</text><line x1="450" y1="652" x2="450" y2="678" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="665" width="200" height="60" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="687" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">CEO status page</text><text x="42" y="705" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">&quot;4 of 6 received&quot;</text><line x1="278" y1="700" x2="232" y2="700" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="255" y="690" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">count</text><rect x="280" y="770" width="340" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="792" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Window closes</text><text x="292" y="810" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">3+ in · CEO closes, or 21 days</text><line x1="450" y1="740" x2="450" y2="768" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="860" width="340" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="882" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Report writer</text><text x="292" y="900" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">sends summaries to Claude</text><circle cx="280" cy="860" r="13" fill="#2f855a"/><text x="280" y="865" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">6</text><line x1="450" y1="830" x2="450" y2="858" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="850" width="220" height="80" rx="10" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/><text x="682" y="872" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Claude API</text><text x="682" y="890" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">(Anthropic, US)</text><text x="682" y="908" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">writes the report</text><line x1="620" y1="880" x2="668" y2="880" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="668" y1="905" x2="620" y2="905" stroke="#333" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="280" y="950" width="340" height="96" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="972" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Automatic checks</text><text x="292" y="990" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">sections · both next steps ·</text><text x="292" y="1008" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">banned words · second AI</text><text x="292" y="1026" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">check for names</text><line x1="450" y1="920" x2="450" y2="948" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="1080" width="160" height="60" rx="10" fill="#e9f6ec" stroke="#2f855a" stroke-width="2"/><text x="292" y="1102" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Pass</text><text x="292" y="1120" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">PDF emailed</text><circle cx="280" cy="1080" r="13" fill="#2f855a"/><text x="280" y="1085" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">7</text><rect x="460" y="1080" width="160" height="60" rx="10" fill="#fdf0e3" stroke="#c05621" stroke-width="2"/><text x="472" y="1102" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Fail</text><text x="472" y="1120" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">report held</text><line x1="400" y1="1046" x2="360" y2="1078" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="1046" x2="540" y2="1078" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="1080" width="200" height="60" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/><text x="42" y="1102" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">CEO gets</text><text x="42" y="1120" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">the report (PDF)</text><line x1="278" y1="1110" x2="232" y2="1110" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="1065" width="220" height="96" rx="10" fill="#fdf0e3" stroke="#c05621" stroke-width="2"/><text x="682" y="1087" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Brandon</text><text x="682" y="1105" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">alert: reasons only</text><text x="682" y="1123" font-size="14" font-