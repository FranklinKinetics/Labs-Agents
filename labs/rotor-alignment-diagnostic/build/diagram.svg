 y="1240" width="220" height="120" rx="10" fill="#f1ecfb" stroke="#6b46c1" stroke-width="2"/><text x="682" y="1262" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Brandon&#x27;s call</text><text x="682" y="1280" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">little to settle →</text><text x="682" y="1298" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Rotor Distillation</text><text x="682" y="1316" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">real gaps →</text><text x="682" y="1334" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">Rotor Beta</text><line x1="232" y1="1340" x2="668" y2="1340" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="450" y="1356" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">report names both; no verdict</text><text x="460.0" y="1451" font-size="12" font-weight="normal" text-anchor="middle" fill="#555">Every email is sent from contact@franklinkinetics.com (Google Workspace). Dashed arrows: happens inside the buyer&#x27;s own tools.</text>
